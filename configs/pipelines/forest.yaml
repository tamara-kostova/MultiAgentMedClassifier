# Stage-pipeline equivalent of pipeline/graph.py:assemble_forest_pipeline (System C).
# Roles / sampling / vote rule come from the run config (--forest_roles, --forest_temperature,
# --forest_top_p, --forest_seed, --forest_vote); n_agents below overrides --forest_n_agents.
name: forest
stages:
  - inference.slice_extraction.from_files
  - inference.io.materialize
  - inference.screening.cnn_topk: {top_k: 3}
  - inference.agents.forest_triage: {n_agents: 3}
  - inference.agents.cnn_classify
  - inference.agents.sam3_segment
  - inference.agents.biomedclip
  - inference.agents.explainability
  - inference.agents.verification
  - inference.agents.report
  - inference.agents.fhir_output
  - inference.aggregation.study: {strategy: max_abnormal}
